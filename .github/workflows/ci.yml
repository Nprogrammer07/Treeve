name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET) · build, pruebas, reglas del Onion y lenguajes permitidos
    runs-on: ubuntu-latest
    # PostgreSQL de usar y tirar para las pruebas que solo la base garantiza (triggers de auditoría, concurrencia).
    # Nunca es Supabase. En la CI esas pruebas no se saltan: si falta la base, fallan (ADR-006).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Treeve.slnx
      - run: dotnet build Treeve.slnx --no-restore --configuration Release
      # Incluye Treeve.ArchitectureTests. Falla si un anillo interno depende de uno externo,
      # si un proyecto queda fuera de la carpeta de su anillo, si hay código fuera de los
      # anillos o si el backend no es C# / el frontend no es TypeScript (ADR-003).
      - run: dotnet test Treeve.slnx --no-build --configuration Release
        env:
          TREEVE_PRUEBAS_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres

  web:
    name: Presentación web (React) · lint, dependencias, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Presentation/Treeve.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/Presentation/Treeve.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Presentation/Treeve.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run depcruise
      - run: npm test
      - run: npm run build
